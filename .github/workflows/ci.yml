name: CI
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gc
          POSTGRES_PASSWORD: gc
          POSTGRES_DB: gc
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgres://gc:gc@localhost:5432/gc
      JWT_SECRET: ci-secret
      # The web build inlines this into the bundle; without it the app throws at boot and
      # the smoke step below fails for the wrong reason. Never contacted — nothing in CI
      # makes a request.
      PUBLIC_API_URL: http://localhost:5000
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      # Builds the web app and boots the emitted bundle. Both production bugs shipped so
      # far (relative asset URLs, an un-inlined PUBLIC_* var) built successfully and broke
      # only at load, so `bun run build` alone would have caught neither — see smoke.ts.
      - run: bun run --filter '@gc/web' smoke
